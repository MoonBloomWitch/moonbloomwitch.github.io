    }

    nav a:hover {

      margin: 35px auto;
    }

    main {

    }

    }

    .article p {
      font-size: 17px;
      line-height: 2;
      margin: 0 0 30px;
    }

    .article p:last-child {
      margin-bottom: 0;
    }

    /* RETOUR */

    .back {
      text-align: center;
      margin-top: 55px;
    }

    .back a {
      color: #68745e;
      text-decoration: none;
      font-style: italic;
      border-bottom: 1px solid #a9a48d;
      padding-bottom: 4px;
    }

    .back a:hover {
      color: #9a8065;
    }

    /* PIED DE PAGE */

    footer {
      text-align: center;
      padding: 60px 20px;
      color: #879477;
      font-size: 14px;
    }


<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">

  <title>Cœur — Lou — MoonBloomWitch</title>
  <meta name="description" content="Un cœur dans l'ombre.">

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #151812;
      color: #aaa89f;
      font-family: Georgia, "Times New Roman", serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: "✦  ✧  ✦  ✧  ✦";
      position: absolute;
      top: 28px;
      left: 0;
      width: 100%;
      text-align: center;
      color: #41463d;
      font-size: 14px;
      letter-spacing: 10px;
    }

    .coeur {
      font-size: clamp(180px, 55vw, 500px);
      line-height: 1;
      color: transparent;
      -webkit-text-stroke: 1px #777d70;
      text-align: center;
      transition: -webkit-text-stroke 0.5s ease;
    }

    .coeur:hover {
      -webkit-text-stroke: 1px #aaa89f;
    }

    .retour {
      margin-top: 40px;
      color: #777d70;
      text-decoration: none;
      font-size: 14px;
      letter-spacing: 1px;
      transition: color 0.3s ease;
    }

    .retour:hover {
      color: #c2bfb3;
    }

    footer {
      position: absolute;
      bottom: 22px;
      font-size: 12px;
      color: #55594e;
      letter-spacing: 2px;
    }
  </style>
</head>

<body>

  <div class="coeur">♡</div>

<a class="retour" href="../lou/index.html" id="retour-lou">
  ← Retour à Lou
</a>

  <footer>
    ☾ ✦ Lou · MoonBloomWitch ✦ ☽
  </footer>
<script>
  const parametres = new URLSearchParams(window.location.search);
  const pageLou = parametres.get('pageLou');

  if (pageLou && /^\d+$/.test(pageLou)) {
    document.getElementById('retour-lou').href =
      '../lou/index.html?pageLou=' + pageLou;
  }
</script>
</body>
</html>


<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">

  <title>À mon seul désir — Lou — MoonBloomWitch</title>

  <meta name="description" content="À mon seul désir — quelques mots sur le souvenir, l'absence et le désir de retrouver un chemin vers l'autre.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #151812;
      color: #aaa89f;
      font-family: Georgia, "Times New Roman", serif;
      line-height: 1.9;
    }

    body::before {
      content: "✦  ✧  ✦  ✧  ✦";
      display: block;
      text-align: center;
      color: #41463d;
      font-size: 14px;
      letter-spacing: 10px;
      padding-top: 25px;
    }

    /* EN-TÊTE */

    header {
      text-align: center;
      padding: 45px 20px 35px;
    }

    .moon {
      font-size: 65px;
      color: #777d70;
      line-height: 1;
    }

    .flowers {
      color: #55594e;
      font-size: 20px;
      letter-spacing: 8px;
      margin: 20px 0;
    }

    h1 {
      font-size: 34px;
      font-weight: normal;
      color: #b0ada3;
      letter-spacing: 2px;
      margin: 0;
    }

    .date {
      margin-top: 18px;
      color: #777d70;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .divider {
      width: 90px;
      height: 1px;
      background: #41463d;
      margin: 30px auto;
    }

    /* ARTICLE */

    main {
      max-width: 700px;
      margin: auto;
      padding: 0 25px 60px;
    }

    .article {
      border-top: 1px solid #353a32;
      border-bottom: 1px solid #353a32;
      padding: 35px 20px;
      text-align: center;
    }

    .article p {
      font-size: 18px;
      line-height: 2;
      color: #96958d;
      margin: 0 0 22px;
    }

    .article p:last-of-type {
      margin-bottom: 0;
    }

    .heart {
      display: block;
      margin-top: 30px;
      color: #777d70;
      font-size: 25px;
    }

    /* RETOUR À L'INDEX DE LOU */

    .back {
      text-align: center;
      margin-top: 45px;
    }

    .back a {
      color: #777d70;
      text-decoration: none;
      font-size: 14px;
      letter-spacing: 1px;
      transition: color 0.3s ease;
    }

    .back a:hover {
      color: #c2bfb3;
    }

    /* PIED DE PAGE */

    footer {
      text-align: center;
      padding: 35px 20px 25px;
      color: #55594e;
      font-size: 12px;
      letter-spacing: 2px;
    }

    /* TÉLÉPHONE */

    @media (max-width: 600px) {
      h1 {
        font-size: 29px;
      }

      .moon {
        font-size: 55px;
      }

      .article {
        padding: 30px 10px;
      }

      .article p {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="moon">☾</div>

    <div class="flowers">
      ❀ ❁ ❀
    </div>

    <h1>À mon seul désir</h1>

    <div class="date">
      Lundi 28 septembre 2026
    </div>

    <div class="divider"></div>
  </header>

  <main>

    <article class="article">

      <p>
        Que reste-t-il de moi en toi&nbsp;?
      </p>

      <p>
        Est-ce que tu m'oublies&nbsp;?
      </p>

      <p>
        Moi je t'oublie pas.
      </p>

      <p>
        Tu es dans ma tête et tu restes dans mon coeur.
      </p>

      <p>
        Je parle au monde en espérant trouver un chemin vers toi.
      </p>

      <span class="heart">♡</span>

    </article>

    <div class="back">
      <a href="index.html" id="retour-lou">
        ← Retour à Lou
      </a>
    </div>

  </main>

  <footer>
    ☾ ✦ Lou · MoonBloomWitch ✦ ☽
  </footer>

  <script>
    const parametres = new URLSearchParams(window.location.search);
    const pageLou = parametres.get('pageLou');

    if (pageLou && /^\d+$/.test(pageLou)) {
      document.getElementById('retour-lou').href =
        'index.html?pageLou=' + pageLou;
    }
  </script>

</body>

</html>
